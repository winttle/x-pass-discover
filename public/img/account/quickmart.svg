<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="A QuickMart convenience store">
  <defs>
    <linearGradient id="qsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2eefb"/><stop offset="100%" stop-color="#f4f8fd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#qsky)"/>

  <!-- storefront -->
  <rect x="80" y="96" width="640" height="300" rx="10" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <!-- fascia -->
  <rect x="80" y="96" width="640" height="62" rx="10" fill="#15803d"/>
  <text x="400" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">QuickMart</text>
  <!-- awning stripes -->
  <g>
    <rect x="80" y="158" width="640" height="18" fill="#f8fafc"/>
    <g fill="#bbf7d0">
      <rect x="110" y="158" width="36" height="18"/><rect x="182" y="158" width="36" height="18"/>
      <rect x="254" y="158" width="36" height="18"/><rect x="326" y="158" width="36" height="18"/>
      <rect x="398" y="158" width="36" height="18"/><rect x="470" y="158" width="36" height="18"/>
      <rect x="542" y="158" width="36" height="18"/><rect x="614" y="158" width="36" height="18"/>
    </g>
  </g>

  <!-- windows -->
  <rect x="104" y="196" width="238" height="168" rx="6" fill="#e6f1fb" stroke="#d3e0ef"/>
  <rect x="458" y="196" width="238" height="168" rx="6" fill="#e6f1fb" stroke="#d3e0ef"/>
  <!-- chiller inside the left window -->
  <rect x="124" y="214" width="198" height="134" rx="5" fill="#ffffff" stroke="#cfdcec"/>
  <g fill="#cfe4f7">
    <rect x="136" y="228" width="174" height="8" rx="3"/>
    <rect x="136" y="262" width="174" height="8" rx="3"/>
    <rect x="136" y="296" width="174" height="8" rx="3"/>
    <rect x="136" y="330" width="174" height="8" rx="3"/>
  </g>
  <g fill="#7fb0ff">
    <rect x="142" y="240" width="13" height="20" rx="3"/><rect x="162" y="240" width="13" height="20" rx="3"/>
    <rect x="182" y="240" width="13" height="20" rx="3"/>
  </g>
  <g fill="#34d399">
    <rect x="142" y="274" width="13" height="20" rx="3"/><rect x="162" y="274" width="13" height="20" rx="3"/>
  </g>
  <g fill="#fbbf24">
    <rect x="142" y="308" width="13" height="20" rx="3"/><rect x="162" y="308" width="13" height="20" rx="3"/>
  </g>

  <!-- shelving in the right window -->
  <g fill="#dbe7f4">
    <rect x="478" y="216" width="198" height="10" rx="4"/>
    <rect x="478" y="258" width="198" height="10" rx="4"/>
    <rect x="478" y="300" width="198" height="10" rx="4"/>
    <rect x="478" y="342" width="198" height="10" rx="4"/>
  </g>

  <!-- door -->
  <rect x="356" y="196" width="88" height="168" rx="6" fill="#d9e8f8" stroke="#c7d8ea"/>
  <circle cx="432" cy="286" r="4" fill="#94a3b8"/>

  <!-- ground + figure -->
  <rect y="384" width="800" height="36" fill="#e9eef5"/>
  <g>
    <circle cx="612" cy="356" r="12" fill="#eab796"/>
    <path d="M600 396v-28a12 12 0 0 1 24 0v28z" fill="#2563eb"/>
  </g>
</svg>
